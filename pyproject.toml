[project]
name = "phishing-detection-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "numpy",
    "scikit-learn==1.9.0",
    "SQLAlchemy",
    "psycopg[binary]",
    "python-dotenv",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "model/**",
]